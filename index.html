<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Перегляд кошика інтернет-магазину</title>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Перегляд кошика інтернет-магазину</h1>
        </header>
        <main>
            <section id="cartForm">
                <input type="number" id="cartIdInput" class="cart-input" placeholder="Введіть ID кошика" value="1" min="1">
                <button type="button" id="loadCartButton">Завантажити кошик</button>
            </section>

            <section id="cartOptions">
                <label>
                    <input type="checkbox" id="testModeCheckbox">
                    Тестовий режим (перша спроба штучно невдала)
                </label>
                <label>
                    Сценарій:
                    <select id="scenarioSelect" class="scenario-select">
                        <option value="normal">Звичайний запит (delay=3000)</option>
                        <option value="404">Помилка HTTP 404</option>
                        <option value="503">Помилка HTTP 503</option>
                        <option value="timeout">Таймаут (2 с при delay=3000)</option>
                    </select>
                </label>
            </section>

            <!-- Область для відображення стану запиту -->
            <section id="cartDisplay" aria-live="polite"></section>

            <!-- Область для відображення даних кошика -->
            <section id="cartData"></section>

            <!-- Область для відображення помилок -->
            <section id="cartError" aria-live="assertive"></section>
        </main>
    </body>
</html>
