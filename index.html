<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <title>Перегляд кошика інтернет-магазину</title>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Перегляд кошика інтернет-магазину</h1>
        </header>
        <main>
            <section id="cartForm">
                <input type="number" id="cartIdInput" placeholder="Введіть ID кошика" value="1">
                <button type="button" id="loadCartButton">Завантажити кошик</button>
            </section>
            <section id="cartDisplay"> 
                <!-- Область для відображення стану запиту-->
            </section>
            <section id="cartData">
                <!-- Область для відображення даних кошика -->
            </section>
            <section id="cartError">
                <!-- Область для відображення помилок -->
            </section>
        </main>
    </body>
</html>
